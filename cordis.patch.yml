# 让 DeepSeek Harness 以「技术文档工程师」角色工作。
# 本插件是「高级开发工程师套件」的独立文档插件；开发本体见 github:nf-shiyang/DSH。
# 配置项（config 块，均可选）：
#   text     — 整体覆盖角色文本（不填则用内置文档角色）
#   name     — section 名（默认 dsh-docs:docs）
#   order    — 排序（默认 61；排在开发核心段 50 之后）
#   complete — true 时本段成为完整 system prompt，抑制其它段
# 用户可在自己 profile 的 cordis.patch.yml / --patch 覆盖整行。
- insert:
    - id: docs
      name: 'dsh-docs'
      config:
        order: 61
